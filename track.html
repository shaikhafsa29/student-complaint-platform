<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            VEMU <span>VOICE</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html">Submit Complaint</a>
            <a href="track.html" class="active">Track Complaint</a>
            <a href="admin-login.html">Admin</a>
        </div>

    </div>
</nav>


<main class="center-page">

    <section class="tracking-card">

        <div class="card-icon">🎫</div>

        <p class="section-label">COMPLAINT TRACKING</p>

        <h1>Track your complaint</h1>

        <p class="card-description">
            Enter the Complaint ID you received after submission.
        </p>


        <form id="trackForm">

            <label for="trackComplaintId">
                Complaint ID
            </label>

            <input
                type="text"
                id="trackComplaintId"
                placeholder="Example: CMP-1234ABCD"
                autocomplete="off"
                required
            >

            <div
                id="trackingError"
                class="form-error"
            ></div>

            <button
                type="submit"
                class="btn btn-primary full-width"
            >
                Track Complaint
            </button>

        </form>


        <div
            id="trackingResult"
            class="tracking-result hidden"
        >

            <div class="result-row">
                <span>Complaint ID</span>
                <strong id="resultComplaintId">-</strong>
            </div>

            <div class="result-row">
                <span>Category</span>
                <strong id="resultCategory">-</strong>
            </div>

            <div class="result-row">
                <span>Status</span>
                <strong id="resultStatus">-</strong>
            </div>

            <div class="result-row">
                <span>Submitted</span>
                <strong id="resultDate">-</strong>
            </div>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
