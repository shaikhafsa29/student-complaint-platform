<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Submitted | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="index.html" class="logo">
            VEMU <span>VOICE</span>
        </a>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="contact.html">
                Submit Complaint
            </a>

            <a href="track.html">
                Track Complaint
            </a>

        </div>

    </div>

</nav>


<main class="success-page">

    <section class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <p class="section-label">
            SUCCESS
        </p>

        <h1>
            Complaint Submitted
        </h1>

        <p class="success-message">
            Your complaint has been successfully submitted.
        </p>


        <div class="complaint-id-box">

            <span>
                Your Complaint ID
            </span>

            <strong id="successComplaintId">
                Loading...
            </strong>

        </div>


        <p class="success-info">
            Please save this Complaint ID. You can use it later
            to track the status of your complaint.
        </p>


        <div class="success-actions">

            <a
                href="track.html"
                class="btn btn-primary">
                Track Complaint
            </a>

            <a
                href="index.html"
                class="btn btn-secondary">
                Go Home
            </a>

        </div>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
