<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            VEMU<span>VOICE</span>
        </a>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Submit Complaint</a>
        <a href="track.html">Track Complaint</a>
        <a href="admin-login.html" class="active">Admin</a>
    </div>

    </nav>


    <main class="admin-login-page">

        <section class="admin-login-card">

            <div class="admin-icon">🔐</div>

            <p class="badge">AUTHORIZED ACCESS ONLY</p>

            <h1>Admin Login</h1>

            <p class="admin-description">
                Sign in to access the complaint management dashboard.
            </p>


            <form id="adminLoginForm">

                <div class="input-group">

                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="submit-btn">
                    Login to Dashboard →
                </button>

            </form>


            <div
                id="loginError"
                class="login-error hidden"
            >
                Invalid username or password.
            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 VEMU Voice • Student Support Platform</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
