<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            VEMU <span>VOICE</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html">Submit Complaint</a>
            <a href="track.html">Track Complaint</a>
            <a href="admin-login.html" class="active">Admin</a>
        </div>

    </div>
</nav>


<main class="center-page">

    <section class="login-card">

        <div class="card-icon">
            🔐
        </div>

        <p class="section-label">
            ADMIN ACCESS
        </p>

        <h1>
            Admin Login
        </h1>

        <p class="card-description">
            Authorized administrators can access and manage
            student complaints.
        </p>


        <form id="adminLoginForm">

            <label for="adminUsername">
                Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <div
                id="loginError"
                class="form-error"
            ></div>


            <button
                type="submit"
                class="btn btn-primary full-width"
            >
                Login
            </button>

        </form>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
