<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            VEMU <span>VOICE</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Submit Complaint</a>
            <a href="track.html">Track Complaint</a>
            <a href="admin-login.html">Admin</a>
        </div>

    </div>
</nav>


<main class="center-page">

    <section class="login-card">

        <div class="card-icon">🎓</div>

        <p class="section-label">STUDENT ACCESS</p>

        <h1>Student Login</h1>

        <p class="card-description">
            Enter your Roll Number to continue to the complaint form.
        </p>


        <form id="studentLoginForm">

            <label for="studentRollNumber">
                Roll Number
            </label>

            <input
                type="text"
                id="studentRollNumber"
                placeholder="Enter your Roll Number"
                maxlength="50"
                autocomplete="off"
                required
            >

            <div
                id="studentLoginError"
                class="form-error"
            ></div>

            <button
                type="submit"
                id="studentLoginBtn"
                class="btn btn-primary full-width"
            >
                Continue
            </button>

        </form>

    </section>

</main>


<script>
document.addEventListener("DOMContentLoaded", () => {

    /*
     * If the student is already logged in,
     * do not show the login card again.
     */
    const savedRollNumber =
        sessionStorage.getItem("studentRollNumber");

    if (savedRollNumber) {
        window.location.replace("contact.html");
        return;
    }

});
</script>

<script src="script.js"></script>

</body>
</html>
