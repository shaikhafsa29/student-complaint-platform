<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint | VemuVoice</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<nav class="navbar">

    <a href="index.html"
       class="logo">
        Vemu<span>Voice</span>
    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html"
           class="active">
            Submit Complaint
        </a>

        <a href="track.html">
            Track Complaint
        </a>

        <a href="admin-login.html">
            Admin
        </a>

    </div>

</nav>



<!-- =========================================================
     MAIN CONTENT
========================================================= -->

<main class="form-page">


    <section class="form-container">


        <!-- FORM INTRO -->

        <div class="form-intro">

            <span class="badge">
                STUDENT SUPPORT
            </span>

            <h1>
                Submit a Complaint
            </h1>

            <p>
                Share your concern with the appropriate
                college authority. You do not need to enter
                your name.
            </p>

        </div>



        <!-- =================================================
             COMPLAINT FORM
        ================================================= -->

        <form id="complaintForm">


            <!-- YEAR -->

            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <select
                    id="year"
                    name="year"
                    required>

                    <option value="">
                        Select your year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                    <option value="4th Year">
                        4th Year
                    </option>

                </select>

            </div>



            <!-- =================================================
                 CLASSROOM / BRANCH
            ================================================= -->

            <div class="form-group">

                <label for="branch">
                    Classroom / Branch
                </label>

                <input
                    type="text"
                    id="branch"
                    name="branch"
                    placeholder="Enter your classroom / branch"
                    autocomplete="off"
                    required>

                <small>
                    Example: CSE-A, AI&DS-B, ECE-A, MECH-B
                </small>

            </div>



            <!-- =================================================
                 CATEGORY
            ================================================= -->

            <div class="form-group">

                <label for="category">
                    Complaint Category
                </label>

                <select
                    id="category"
                    name="category"
                    required>

                    <option value="">
                        Select complaint category
                    </option>

                    <option value="Academic">
                        Academic
                    </option>

                    <option value="Faculty">
                        Faculty
                    </option>

                    <option value="Infrastructure">
                        Infrastructure
                    </option>

                    <option value="Hostel">
                        Hostel
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Canteen">
                        Canteen
                    </option>

                    <option value="Examination">
                        Examination
                    </option>

                    <option value="Fees">
                        Fees
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>



            <!-- =================================================
                 RECIPIENT
            ================================================= -->

            <div class="form-group">

                <label for="recipient">
                    Send Complaint To
                </label>

                <select
                    id="recipient"
                    name="recipient"
                    required>

                    <option value="">
                        Select recipient
                    </option>

                    <option value="Class Teacher">
                        Class Teacher
                    </option>

                    <option value="HOD">
                        HOD
                    </option>

                    <option value="Principal">
                        Principal
                    </option>

                </select>

            </div>



            <!-- =================================================
                 COMPLAINT DESCRIPTION
            ================================================= -->

            <div class="form-group">

                <label for="message">
                    Complaint Description
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    maxlength="1000"
                    placeholder="Describe your complaint clearly..."
                    required></textarea>

                <div class="character-counter">

                    <span>
                        Maximum 1000 characters
                    </span>

                    <span id="charCount">
                        0 / 1000
                    </span>

                </div>

            </div>



            <!-- ERROR -->

            <div id="complaintError"
                 class="error-message hidden">
            </div>



            <!-- =================================================
                 SUBMIT BUTTON
            ================================================= -->

            <button
                type="submit"
                id="complaintSubmitBtn"
                class="submit-btn">

                Submit Complaint →

            </button>


        </form>


    </section>


</main>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
