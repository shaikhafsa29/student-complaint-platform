<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint | VEMU Voice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            VEMU <span>VOICE</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="login.html" class="active">Submit Complaint</a>
            <a href="track.html">Track Complaint</a>
            <a href="admin-login.html">Admin</a>
        </div>

    </div>
</nav>


<main class="page-container">

    <section class="page-header">

        <p class="section-label">SUBMIT COMPLAINT</p>

        <h1>Tell us what happened.</h1>

        <p>
            Provide the necessary details so your concern can
            reach the appropriate authority.
        </p>

    </section>


    <section class="form-card">

        <form id="complaintForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="branch">
                        Branch
                    </label>

                    <select id="branch" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="CSE (AI & DS)">CSE (AI & DS)</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                        <option value="Other">Other</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Academic">Academic</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Hostel">Hostel</option>
                        <option value="Transport">Transport</option>
                        <option value="Examination">Examination</option>
                        <option value="Fees">Fees</option>
                        <option value="Other">Other</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="recipient">
                        Send Complaint To
                    </label>

                    <select id="recipient" required>
                        <option value="">
                            Select Authority
                        </option>
                        <option value="Class Teacher">
                            Class Teacher
                        </option>
                        <option value="HOD">
                            HOD
                        </option>
                        <option value="Principal">
                            Principal
                        </option>
                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="message">
                    Complaint Description
                </label>

                <textarea
                    id="message"
                    maxlength="1000"
                    rows="8"
                    placeholder="Describe your concern clearly..."
                    required
                ></textarea>

                <div class="character-count">
                    <span id="charCount">0</span>/1000
                </div>

            </div>


            <div
                id="complaintError"
                class="form-error"
            ></div>


            <button
                type="submit"
                id="complaintSubmitBtn"
                class="btn btn-primary"
            >
                Submit Complaint
            </button>

        </form>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
